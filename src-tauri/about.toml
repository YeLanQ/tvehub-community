# accepted = 可接受的许可 Licensee 优先级表（单 id；组合表达式由 cargo-about
# 用本表组合满足）。全为宽松/弱保留许可，无 copyleft。桌面端 Rust 依赖出现
# 的新许可会让 generate 报错并列出表达式，把它补进本清单即可。重生成：pnpm license:rust
# 注：自有 crate tve-hub 已在 Cargo.toml 标 publish = false，并由 private.ignore
# 排除——自有代码本就不属于第三方声明，属预期行为。
# 桌面端 Rust 依赖出现的新许可会让 generate 报错并列出表达式，把它补进 accepted 即可。
